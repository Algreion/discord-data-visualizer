async function ingest(list){
 let pre='';for(const[p]of list){const m=p.match(/^(.*?\/)?(?:Account\/user|Messages\/index|Servers\/index)\.json$/i);if(m){pre=m[1]||'';break}}

function tree(v,k,o=0){const sens=/^(email|phone|ip)$/i.test(k);

 d.innerHTML=`<h2>Search</h2><div class="fr"><input id="q" placeholder="Keyword or regular expression"><label><input type="checkbox" id="rx">Regex</label><label><input type="checkbox" id="cs">Match case</label></div>

 <select id="hs"><option value="">Any content</option><option value="att">Has attachment</option><option value="no">No attachment</option><option value="link">Has link</option></select><select id="so"><option value="">Oldest first</option><option value="d">Newest first</option></select></div><p id="s0" class="mu"></p><div id="sr"></div>`;
 d.addEventListener('input',e=>{if(e.target.id=='q'){clearTimeout(S.dt);S.dt=setTimeout(runSearch,200)}});
 d.addEventListener('change',e=>{if(e.target.id=='sv'){const s=S.srv.get(e.target.value);d.querySelector('#cn').innerHTML='<option value="">All channels</option>'+(s?s.chans.filter(c=>c.msgs.length).map(c=>`<option value="${c.id}">${E(c.name)}${c.handle?` (@${E(c.handle)})`:''}</option>`).join(''):'')}runSearch()});return d}
function runSearch(){const g=i=>S.sdom.querySelector('#'+i),q=g('q').value,s0=g('s0');let re=null;
 if(q)try{re=new RegExp(g('rx').checked?q:q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),g('cs').checked?'':'i')}catch(e){s0.textContent='Invalid regular expression: '+e.message;g('sr').innerHTML='';return}
 const t1=g('d1').value?dt(g('d1').value):-1/0,t2=g('d2').value?dt(g('d2').value)+864e5:1/0,hs=g('hs').value,sv=S.srv.get(g('sv').value),cn=S.ch.get(g('cn').value);
 const src=cn?cn.msgs:sv?srvList(sv):S.M,out=[];
 for(const m of src){if(m.t<t1||m.t>=t2)continue;if(hs=='att'&&!m.a||hs=='no'&&m.a||hs=='link'&&!/https?:\/\//.test(m.s))continue;if(re&&!re.test(m.s)&&!re.test(m.a))continue;out.push(m)}
 if(g('so').value)out.reverse();S.res=out;S.rn=0;s0.textContent=`${fn(out.length)} message${out.length==1?'':'s'} found`;g('sr').innerHTML='';S.re=re;more()}
function more(){const g=S.sdom.querySelector('#sr');g.querySelector('.mb2')?.remove();const a=S.rn,b=Math.min(S.res.length,a+100),re=S.re&&new RegExp(S.re.source,S.re.flags+'g');let h='';
 for(let i=a;i<b;i++){const m=S.res[i];let s=m.s,i0=0;if(re){re.lastIndex=0;const x=re.exec(s);i0=x?Math.max(0,x.index-80):0}s=s.slice(i0,i0+320);let e=re?E(s.replace(re,x=>'\u0001'+x+'\u0002')).replace(/\u0001/g,'<mark>').replace(/\u0002/g,'</mark>'):E(s);
  h+=`<div class="res" data-a="goto:${i}"><small>${E(cl(m.ch,1))} · ${DT(m.t)}${m.a?' · 📎':''}</small><p>${i0?'…':''}${e||'<i class="mu">(no text)</i>'}</p></div>`}
 g.insertAdjacentHTML('beforeend',h+(b<S.res.length?`<button class="g mb2" data-a="more">Show more (${fn(S.res.length-b)} left)</button>`:''));S.rn=b}

function act(a){const i=a.indexOf(':'),x=i<0?a:a.slice(0,i),y=a.slice(i+1);if(!['goto','gts','cp','st'].includes(x))S.back=false;
 if(x=='x'){$('#modal').style.display='none';$('#sp').style.display='none'}else if(x=='home')go({r:'home',v:'ov'});else if(x=='all')go({r:'home',v:'all'});else if(x=='search')go({v:'search'});else if(x=='acct'){if(S.nav.v=='acct'&&S.prev){const p=S.prev;S.prev=null;go({...p})}else{if(S.nav.v!='acct')S.prev=S.nav;go({v:'acct'})}}
 else if(x=='ch'){const c=S.ch.get(y);go({r:c.dm?'home':c.srv,v:'ch',ch:y})}else if(x=='srv')go({r:y,v:'srv'});else if(x=='srvall')go({r:y,v:'srvall'});else if(x=='json')go({r:'json',v:'json',file:y||null});

 else if(x=='exp')exp();else if(x=='imp')$('#impf').click();else if(x=='clx'){exp();setTimeout(clearAll,900)}else if(x=='clr')clearAll();
